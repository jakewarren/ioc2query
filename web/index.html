<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ioc2query - IOC to Query Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="wasm_exec.js"></script>
</head>

<body class="dark-theme">
    <a href="https://github.com/jakewarren/ioc2query" class="github-corner" aria-label="View source on GitHub">
        <svg width="80" height="80" viewBox="0 0 250 250"
            style="fill:var(--primary-color); color:var(--card-bg); position: absolute; top: 0; border: 0; right: 0; z-index: 1000;"
            aria-hidden="true">
            <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
            <path
                d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
                fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
            <path
                d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.3 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"
                fill="currentColor" class="octo-body"></path>
        </svg>
    </a>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>ioc2query</h1>
                <p>Extract indicators and generate threat hunting queries</p>
            </div>
            <button id="theme-toggle" aria-label="Toggle Theme">
                <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="display: none;">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </header>

        <main>
            <div class="input-section card">
                <div class="card-header">
                    <h2>Input</h2>
                    <span class="helper-text">Paste logs, emails, or raw text containing IOCs</span>
                </div>
                <textarea id="input-data" placeholder="Paste your indicators here..."></textarea>
            </div>

            <div class="controls-section card">
                <div class="controls-grid">
                    <div class="control-group">
                        <label for="backend-select">Backend</label>
                        <select id="backend-select">
                            <option value="s1">SentinelOne (S1QL)</option>
                        </select>
                    </div>
                    <div class="control-group checkbox-group">
                        <label class="checkbox-container">
                            <input type="checkbox" id="separate-checkbox">
                            <span class="checkmark"></span>
                            Separate Queries
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" id="verbose-checkbox">
                            <span class="checkmark"></span>
                            Verbose Output
                        </label>
                    </div>
                    <div class="control-group action-group">
                        <button id="run-button" class="btn-primary">Generate Queries</button>
                    </div>
                </div>
            </div>

            <div class="output-section card">
                <div class="card-header">
                    <h2>Output</h2>
                    <button id="copy-button" class="btn-secondary btn-sm">Copy</button>
                </div>
                <div id="loading" class="hidden">
                    <div class="spinner"></div>
                    <span>Processing...</span>
                </div>
                <pre id="output-terminal" class="terminal"></pre>
            </div>
        </main>

        <footer>
            <p>Built with Go & WASM. All processing happens in your browser.</p>
            <p><a href="https://github.com/jakewarren/ioc2query">Source Code</a></p>
        </footer>
    </div>
    <script src="main.js"></script>
</body>

</html>
