<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ioc2query - IOC to Query Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="wasm_exec.js"></script>
</head>

<body class="dark-theme">
    <div class="container">
        <header>
            <div class="header-content">
                <h1>ioc2query</h1>
                <p>Extract indicators and generate threat hunting queries</p>
            </div>
            <button id="theme-toggle" aria-label="Toggle Theme">
                <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="display: none;">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </header>

        <main>
            <div class="input-section card">
                <div class="card-header">
                    <h2>Input</h2>
                    <span class="helper-text">Paste logs, emails, or raw text containing IOCs</span>
                </div>
                <textarea id="input-data" placeholder="Paste your indicators here..."></textarea>
            </div>

            <div class="controls-section card">
                <div class="controls-grid">
                    <div class="control-group">
                        <label for="backend-select">Backend</label>
                        <select id="backend-select">
                            <option value="s1">SentinelOne (S1QL)</option>
                        </select>
                    </div>
                    <div class="control-group checkbox-group">
                        <label class="checkbox-container">
                            <input type="checkbox" id="separate-checkbox">
                            <span class="checkmark"></span>
                            Separate Queries
                        </label>
                        <label class="checkbox-container">
                            <input type="checkbox" id="verbose-checkbox">
                            <span class="checkmark"></span>
                            Verbose Output
                        </label>
                    </div>
                    <div class="control-group action-group">
                        <button id="run-button" class="btn-primary">Generate Queries</button>
                    </div>
                </div>
            </div>

            <div class="output-section card">
                <div class="card-header">
                    <h2>Output</h2>
                    <button id="copy-button" class="btn-secondary btn-sm">Copy</button>
                </div>
                <div id="loading" class="hidden">
                    <div class="spinner"></div>
                    <span>Processing...</span>
                </div>
                <pre id="output-terminal" class="terminal"></pre>
            </div>
        </main>

        <footer>
            <p>Built with Go & WASM. All processing happens in your browser.</p>
            <p><a href="https://github.com/jakewarren/ioc2query">Source Code</a></p>
        </footer>
    </div>
    <script src="main.js"></script>
</body>

</html>
